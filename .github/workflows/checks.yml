name: Algorithm checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.4.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4
      - name: Tracker and checkpoint checks
        run: python -m unittest discover -s tests -p 'test_moco*.py' -v
      - name: Distributed gradient reductions
        run: torchrun --standalone --nproc-per-node=2 tests/test_distributed_moco.py
      - name: FSDP cache equivalence
        run: torchrun --standalone --nproc-per-node=2 tests/test_distributed_moco_cache.py
      - name: Python syntax
        run: python -m compileall -q src scripts runtime tests eval
