trainer:
  nnodes: 1
  n_gpus_per_node: 8

data:
  path: ???
  prompt_key: prompt
  n_samples: 5
  # Null resolves to rollout.seed + slot index.  Explicit lists are preferred
  # for paired multi-method evaluation and must contain unique values.
  sample_seeds: null
  output_path: ???
  batch_size: 128

model:
  path: ???
  external_lib: null

# ActorRolloutRefWorker reads this field while constructing its device mesh,
# even when it is instantiated with the rollout-only role.
actor:
  ulysses_sequence_parallel_size: 1

rollout:
  name: vllm
  seed: 0
  temperature: 1.0
  top_k: 50 # 0 for hf rollout, -1 for vllm rollout
  top_p: 0.7
  prompt_length: 1536
  response_length: 512
  # for vllm rollout
  dtype: bfloat16 # should align with FSDP
  gpu_memory_utilization: 0.5
  ignore_eos: False
  micro_batch_size: 256
  enforce_eager: True
  free_cache_engine: True
  load_format: dummy_dtensor
  tensor_model_parallel_size: 1
  max_num_batched_tokens: 8192
  max_num_seqs: 1024
  log_prob_micro_batch_size: 8
  # main_generation repeats generate_sequences in its outer n_samples loop.
  n: 1
  # for hf rollout
  do_sample: True
